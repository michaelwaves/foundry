# Defaults for activation-collection runs. All paths are absolute or relative
# to the working directory the orchestrator is launched from. Override any
# field on the command line, e.g. `subsample=100 out_dir=/tmp/foo`.
model: ???              # rfd3 | rf3
sources: ???            # path to sources.csv
hooks_yaml: ???         # path to hooks YAML for the chosen model
out_dir: ???            # where saffron collect writes activations.h5
inputs_json: null       # if null, derived as ${out_dir}/inputs.json
partial_t: 5.0          # rfd3 only
subsample: null
seed: 0

hydra:
  output_subdir: null
  run:
    dir: .
