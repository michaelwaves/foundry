# RFD3 partial-diffusion activation hooks. Same module paths as the trained
# SAEs at outputs/sae/2026-04-20_05-38-45/, so we can reuse them directly via
# `extractor: sae_encode` in the detector configs.
#
# `transition_block` outputs are the classic SAE residual-stream targets.
# Partial-diffusion trajectories run for fewer steps than full denoising
# (only the last fraction of the schedule), so collect_every_n_steps is
# tighter (every 5 vs 20 in the full-diffusion runs).

hooks:
  - name: token_initializer_outputs
    module_path: token_initializer.process_s_init
    hook_type: static
  - name: block6
    module_path: diffusion_module.diffusion_transformer.blocks.6.transition_block
    hook_type: dynamic
    collect_every_n_steps: 5
  - name: block8
    module_path: diffusion_module.diffusion_transformer.blocks.8.transition_block
    hook_type: dynamic
    collect_every_n_steps: 5
  - name: block12
    module_path: diffusion_module.diffusion_transformer.blocks.12.transition_block
    hook_type: dynamic
    collect_every_n_steps: 5
