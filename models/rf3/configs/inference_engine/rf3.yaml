# @package _global_

defaults:
  - base
  - _self_

_target_: rf3.inference_engines.rf3.RF3InferenceEngine

ckpt_path: rf3

# Transform arguments
n_recycles: 10
diffusion_batch_size: 5

# Sampling
num_steps: 50
template_noise_scale: 1e-5

# Model arguments
early_stopping_plddt_threshold: 0.5
seed: null
verbose: false
raise_if_missing_msa_for_protein_of_length_n: null

# Metrics
metrics_cfg:
  # (For confidence outputs)
  ptm:
    _target_: rf3.metrics.predicted_error.ComputePTM
  iptm:
    _target_: rf3.metrics.predicted_error.ComputeIPTM
  count_clashing_chains:
    _target_: rf3.metrics.clashing_chains.CountClashingChains

# SAE activation collection (saffron-collect). Populated at runtime by the rf3
# collector from the embedded run_config in the inputs JSON, or via `hooks=...`.
activation_collection: null

# Activation steering during inference (saffron-steer). Populated at runtime
# from the embedded run_config in the inputs JSON.
steering: null