[project]
name = "rc-foundry-detectors"
version = "0.0.0"
description = "Toxic/viral detectors over RFD3 SAE features."
requires-python = ">=3.12,<3.13"
authors = [{ name = "Institute for Protein Design", email = "contact@ipd.uw.edu" }]
dependencies = [
    "torch>=2.2.0,<3",
    "numpy",
    "scipy>=1.10",
    "pandas>=2.0",
    "pyarrow>=14",
    "h5py>=3.10",
    "omegaconf>=2.3",
    "typer>=0.20",
    "rc-foundry-sae",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/detectors"]

[project.scripts]
detect = "detectors.cli:app"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
