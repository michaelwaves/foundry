[project]
name = "rc-foundry-sae"
version = "0.0.0"
description = "Sparse autoencoder utilities for Foundry — activation hooks and buffers."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "Institute for Protein Design", email = "contact@ipd.uw.edu" },
]
dependencies = [
    "torch>=2.2.0,<3",
    "h5py>=3.10",
    "numpy",
    "einops",
    "hydra-core>=1.3",
    "wandb",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sae"]
